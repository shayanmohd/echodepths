<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!-- EchoDepths: a lamp in the dark, and the ring of sound leaving it. Abyssal teal to cyan on deep navy. -->
  <defs>
    <radialGradient id="abyss" cx="0.5" cy="0.47" r="0.66">
      <stop offset="0" stop-color="#0d3247"/>
      <stop offset="0.5" stop-color="#071a2c"/>
      <stop offset="1" stop-color="#030a14"/>
    </radialGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7df1ff" stop-opacity="0.5"/>
      <stop offset="0.3" stop-color="#37c4dd" stop-opacity="0.2"/>
      <stop offset="0.7" stop-color="#1f8fa8" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#1f8fa8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#d8fbff"/>
      <stop offset="1" stop-color="#8eefff"/>
    </radialGradient>
    <linearGradient id="ringA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6fcff"/>
      <stop offset="1" stop-color="#5fe7f8"/>
    </linearGradient>
    <linearGradient id="ringB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86ecfa"/>
      <stop offset="1" stop-color="#2fb8d2"/>
    </linearGradient>
    <linearGradient id="ringC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46bfd4"/>
      <stop offset="1" stop-color="#1b8296"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9df2ff"/>
      <stop offset="1" stop-color="#2fb8d2"/>
    </linearGradient>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2.2" result="o"/>
      <feFlood flood-color="#02070e" flood-opacity="0.7"/>
      <feComposite in2="o" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="halo" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <filter id="haze" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <filter id="grain" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <g id="bg">
    <rect width="108" height="108" fill="url(#abyss)"/>
    <rect width="108" height="108" filter="url(#grain)" opacity="0.06"/>
    <!-- cave walls at the rim, the way the game draws them: faint ember-teal, jittered polylines -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#1d6f82" stroke-width="1.3" opacity="0.5">
      <path d="M-2 22 L6 19 L11 24 L18 21 L23 26 L29 22 L33 27"/>
      <path d="M78 6 L83 11 L90 8 L95 14 L101 12 L108 18"/>
      <path d="M-2 86 L5 82 L9 88 L16 86 L20 92 L26 89"/>
      <path d="M84 96 L89 92 L95 97 L101 94 L106 100"/>
      <path d="M96 40 L101 46 L98 53 L103 60 L100 68"/>
      <path d="M8 44 L5 51 L9 58 L4 66 L8 72"/>
    </g>
    <!-- marine snow -->
    <g fill="#bff6ff">
      <circle cx="18" cy="14" r="0.7" opacity="0.55"/>
      <circle cx="64" cy="9" r="0.55" opacity="0.4"/>
      <circle cx="90" cy="27" r="0.8" opacity="0.5"/>
      <circle cx="14" cy="60" r="0.5" opacity="0.35"/>
      <circle cx="97" cy="80" r="0.6" opacity="0.45"/>
      <circle cx="40" cy="98" r="0.7" opacity="0.4"/>
      <circle cx="72" cy="101" r="0.5" opacity="0.3"/>
      <circle cx="30" cy="34" r="0.45" opacity="0.35"/>
    </g>
    <rect width="108" height="108" fill="url(#bloom)"/>
  </g>

  <g id="fg">
    <!-- the sound reaching the cave wall, top left: the only thing in the game you ever see -->
    <path d="M27 44 L31 36 L37 32 L41 26" fill="none" stroke="#2fb8d2" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" filter="url(#halo)"/>
    <path d="M27 44 L31 36 L37 32 L41 26" fill="none" stroke="url(#wall)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
    <!-- three rings leaving the lamp: brightest and heaviest nearest, thinning as they travel -->
    <g fill="none" filter="url(#soft)">
      <circle cx="54" cy="54" r="27" stroke="url(#ringC)" stroke-width="2" opacity="0.82"/>
      <circle cx="54" cy="54" r="18.5" stroke="url(#ringB)" stroke-width="2.8" opacity="0.92"/>
      <circle cx="54" cy="54" r="10.5" stroke="url(#ringA)" stroke-width="3.6"/>
    </g>
    <!-- highlight edge along the top of the inner rings -->
    <path d="M45.8 48.2 A10.5 10.5 0 0 1 62.2 48.2" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <path d="M39.6 46.2 A18.5 18.5 0 0 1 68.4 46.2" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" opacity="0.28"/>
    <!-- the lamp -->
    <circle cx="54" cy="54" r="7" fill="#8ff3ff" opacity="0.75" filter="url(#halo)"/>
    <circle cx="54" cy="54" r="4.3" fill="url(#lamp)"/>
    <circle cx="54" cy="54" r="4.3" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.7"/>
  </g>

  <g id="mono">
    <path d="M27 44 L31 36 L37 32 L41 26" fill="none" stroke="#000" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="54" cy="54" r="27" fill="none" stroke="#000" stroke-width="2.4"/>
    <circle cx="54" cy="54" r="18.5" fill="none" stroke="#000" stroke-width="3"/>
    <circle cx="54" cy="54" r="10.5" fill="none" stroke="#000" stroke-width="3.8"/>
    <circle cx="54" cy="54" r="4.6" fill="#000"/>
  </g>
</svg>
